[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-computing-portfolio"
version = "0.1.0"
description = "A comprehensive 6-project quantum computing portfolio: fundamentals, algorithms, noise mitigation, VQE chemistry, Schrödinger solver, and teaching studio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "qiskit>=1.0.0",
    "streamlit>=1.30.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
chemistry = [
    "pyscf>=2.4.0; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
