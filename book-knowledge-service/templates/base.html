<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{% block title %}Sri Ganesh School — Book Knowledge Service{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background-color: #f4f7f6; color: #212529; }
.navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
.card { border-radius: 8px; border: 1px solid #e2e8f0; }
.badge { font-weight: 500; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 py-2 shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/ui">
      <i class="bi bi-book-half text-primary"></i>
      <span>Sri Ganesh School</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="topNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/ui"><i class="bi bi-collection"></i> Library</a></li>
        <li class="nav-item"><a class="nav-link" href="/ui/question-bank"><i class="bi bi-grid-3x3"></i> Question Bank</a></li>
        <li class="nav-item"><a class="nav-link" href="/ui/review"><i class="bi bi-layout-split"></i> Review Studio</a></li>
        <li class="nav-item"><a class="nav-link" href="/ui/assignments"><i class="bi bi-clipboard-check"></i> Assignments</a></li>
        <li class="nav-item"><a class="nav-link" href="/ui/tasks"><i class="bi bi-list-task"></i> Tasks</a></li>
        {% if user and user.is_admin %}
        <li class="nav-item"><a class="nav-link" href="/ui/students"><i class="bi bi-people"></i> Students</a></li>
        <li class="nav-item"><a class="nav-link" href="/ui/compiled-pdfs"><i class="bi bi-file-earmark-pdf"></i> Compiled PDFs</a></li>
        {% endif %}
      </ul>
      <div class="d-flex align-items-center gap-3 text-light">
        <span class="small text-muted">{{ user.username if user else 'Guest' }} · {{ user.role if user else '' }}</span>
        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<main class="container-fluid py-4 px-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function logout() {
  await fetch('/auth/logout', {method:'POST'});
  location.href = '/login';
}
</script>
</body>
</html>
