<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Students — Book Knowledge Service</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f0f2f5;color:#1f2328;min-height:100vh}
header{background:#1e2a3a;color:#e0e6f0;padding:14px 32px;display:flex;align-items:center;gap:16px}
header h1{margin:0;font-size:1.15em;font-weight:600}
.container{max-width:640px;margin:28px auto;padding:0 24px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:22px 26px;margin-bottom:22px}
h2{margin:0 0 14px;font-size:1em}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:140px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:.9em;font-family:inherit}
input:focus{outline:none;border-color:#4a9edd}
button{padding:8px 18px;border:none;border-radius:6px;background:#4a9edd;color:#fff;font-size:.88em;font-weight:600;cursor:pointer}
button:hover{background:#2980b9}
button:disabled{opacity:.6;cursor:default}
#msg{margin-top:12px;font-size:.84em;min-height:18px}
.ok{color:#065f46}.err{color:#991b1b}
ul{list-style:none;margin:0;padding:0}
li{padding:9px 0;border-bottom:1px solid #f0f2f5;font-size:.92em}
li:last-child{border-bottom:none}
.empty{color:#9ca3af;font-size:.9em}
</style>
</head>
<body>
<header>
  <h1><a href="/ui" style="color:#8fa0b0;text-decoration:none">📚 Library</a>
      <span style="color:#4a5568;margin:0 8px">›</span>Students</h1>
  {% include "_userbar.html" %}
</header>

<div class="container">
  <div class="card">
    <h2>Add a student</h2>
    <form class="row" id="add-form">
      <input id="new-name" placeholder="Name" autocomplete="off" required/>
      <input id="new-pass" type="text" placeholder="Password" autocomplete="off" required/>
      <button type="submit" id="add-btn">Add</button>
    </form>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>Students <span id="count" style="font-weight:400;color:#6b7280"></span></h2>
    <ul id="student-list"><li class="empty">Loading…</li></ul>
  </div>
</div>

<script>
async function loadStudents() {
  const res = await fetch('/auth/students');
  if (res.status === 401 || res.status === 403) { location.href = '/login'; return; }
  const d = await res.json();
  const ul = document.getElementById('student-list');
  ul.innerHTML = '';
  document.getElementById('count').textContent = d.total ? `(${d.total})` : '';
  if (!d.students.length) {
    const li = document.createElement('li');
    li.className = 'empty'; li.textContent = 'No students yet.';
    ul.appendChild(li);
    return;
  }
  d.students.forEach(name => {
    const li = document.createElement('li');
    li.textContent = name;
    ul.appendChild(li);
  });
}

document.getElementById('add-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('add-btn');
  const msg = document.getElementById('msg');
  const nameEl = document.getElementById('new-name');
  const passEl = document.getElementById('new-pass');
  btn.disabled = true; msg.textContent = ''; msg.className = '';
  try {
    const res = await fetch('/auth/students', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: nameEl.value, password: passEl.value}),
    });
    const d = await res.json().catch(() => ({}));
    if (res.ok) {
      msg.className = 'ok'; msg.textContent = `✓ Student "${d.username}" added.`;
      nameEl.value = ''; passEl.value = '';
      loadStudents();
    } else {
      msg.className = 'err';
      msg.textContent = typeof d.detail === 'string' ? d.detail : 'Could not add student.';
    }
  } catch (ex) {
    msg.className = 'err'; msg.textContent = 'Network error: ' + ex.message;
  }
  btn.disabled = false;
});

loadStudents();
</script>
</body>
</html>
